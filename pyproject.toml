[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milogpulse"
version = "0.1.0"
description = "MiLoG / FKS pre-audit CLI for German hospitality timesheet CSV exports"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sysrqio" }]
dependencies = ["python-dateutil>=2.8.2"]
keywords = ["milog", "zeiterfassung", "gastronomie", "fks", "compliance"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
milogpulse = "milogpulse.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["milogpulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
